<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards English</title>
<style>
  html, body { margin: 0; padding: 0; background: #006437; }
  #error-box {
    display: none;
    color: #FFFFFF;
    font-family: sans-serif;
    padding: 24px;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.5;
    white-space: pre-wrap;
  }
</style>

<!-- React (via CDN, sem precisar instalar nada) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel: converte o JSX dos arquivos do app para JS puro, direto no navegador -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

<div id="root"></div>
<div id="error-box"></div>

<script>
  function showError(message) {
    var box = document.getElementById("error-box");
    box.style.display = "block";
    box.innerText = "Não consegui carregar o app.\n\n" + message;
    console.error(message);
  }

  // Arquivos do app, carregados nesta ordem — cada um vira um <script>
  // "clássico" avaliado no escopo global, então const/function do topo de
  // um arquivo continuam visíveis nos arquivos seguintes (é assim que
  // scripts sem type="module" sempre funcionaram; sem isso não daria pra
  // dividir o app em vários arquivos sem um bundler).
  //
  // A ordem importa: um arquivo só pode usar o que os arquivos ANTES dele
  // já declararam. Pra adicionar um nível novo, veja o comentário em
  // src/data/levels/index.js — o resumo é: crie src/data/levels/<nivel>.js
  // e liste-o aqui, logo antes de "src/data/levels/index.js".
  var FILES = [
    "src/bootstrap.js",
    "src/data/categories.js",
    "src/data/music.js",
    "src/data/levels/pre-intermediate.js",
    "src/data/levels/index.js",
    "src/utils/helpers.js",
    "src/utils/audio.js",
    "src/components/SpeakButton.jsx",
    "src/components/MusicScreen.jsx",
    "src/components/PhraseScreen.jsx",
    "src/components/SummaryScreen.jsx",
    "src/components/QuizScreen.jsx",
    "src/components/LevelMenu.jsx",
    "src/app.jsx"
  ];

  function stripModuleSyntax(code) {
    // Os arquivos não usam import/export de verdade como mecanismo de
    // compartilhamento (isso é feito via escopo global, acima) — mas caso
    // algum arquivo tenha um import de "react" só por costume, removemos
    // aqui pra não quebrar o Babel.
    return code
      .replace(/^\s*import\s+(?:(?:React\s*,\s*)?\{([^}]+)\}|React|\*\s+as\s+React)\s+from\s*["']react["'];?\s*$/gm, function (_, namedImports) {
        return namedImports ? "const {" + namedImports + "} = React;" : "";
      })
      .replace(/export\s+default\s+/g, "");
  }

  async function loadAll() {
    for (var i = 0; i < FILES.length; i++) {
      var file = FILES[i];
      var res = await fetch(file + "?v=" + Date.now());
      if (!res.ok) {
        throw new Error("Arquivo " + file + " não encontrado (status " + res.status + ").");
      }
      var code = await res.text();
      var cleaned = stripModuleSyntax(code);
      if (/^\s*(?:import|export)\b/m.test(cleaned)) {
        throw new Error("O arquivo " + file + " usa import/export não suportado pelo carregador do app.");
      }
      var compiled = Babel.transform(cleaned, {
        filename: file,
        presets: [["react", { runtime: "classic" }]]
      }).code;

      // Executa em escopo global — cada arquivo soma suas declarações às
      // dos arquivos já carregados antes dele.
      (0, eval)(compiled);
    }
  }

  loadAll()
    .then(function () {
      if (typeof FlashcardCatalog === "undefined") {
        throw new Error("O componente FlashcardCatalog não foi encontrado (verifique src/app.jsx).");
      }
      var root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(FlashcardCatalog));
    })
    .catch(function (err) {
      showError(err.message);
    });
</script>

</body>
</html>

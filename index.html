<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flashcards English</title>
<style>
  /* box-sizing: border-box everywhere — sem isso, padding somado a width:100%
     em telas estreitas gera overflow horizontal (barra de rolagem lateral,
     conteúdo cortado) em vez de simplesmente encolher junto com o layout. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #006437;
    overflow-x: hidden;
    width: 100%;
  }
  #error-box {
    display: none;
    color: #FFFFFF;
    font-family: sans-serif;
    padding: 24px;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.5;
    white-space: pre-wrap;
  }
</style>

<!-- React (via CDN, sem precisar instalar nada) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel: converte o JSX dos arquivos do app para JS puro, direto no navegador -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Firebase (opcional): login com Google + Firestore, pra sincronizar o
     progresso entre aparelhos. Se src/firebaseConfig.js não estiver
     preenchido, esses scripts carregam mas ficam sem uso — o app continua
     funcionando 100% com localStorage. Veja src/firebaseConfig.js pra
     configurar. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="root"></div>
<div id="error-box"></div>

<script>
  function showError(message) {
    var box = document.getElementById("error-box");
    box.style.display = "block";
    box.innerText = "Couldn't load the app.\n\n" + message;
    console.error(message);
  }

  // Arquivos do app, carregados nesta ordem. Cada um é buscado e compilado
  // (Babel) separadamente, mas todos são executados juntos, num único
  // eval() no final — de propósito: um const/function no topo de um
  // arquivo só continua "visível" pros arquivos seguintes se todos rodarem
  // dentro do MESMO eval(). Chamar eval() uma vez por arquivo parece que
  // devia funcionar (é assim que tags <script> separadas se comportam),
  // mas eval() não segue essa regra: cada chamada de eval() ganha seu
  // próprio escopo para let/const, descartado assim que ela termina — por
  // isso juntamos tudo antes de rodar.
  //
  // A ordem importa: um arquivo só pode usar o que os arquivos ANTES dele
  // já declararam. Pra adicionar um nível novo, veja o comentário em
  // src/data/levels/index.js — o resumo é: crie src/data/levels/<nivel>.js
  // e liste-o aqui, logo antes de "src/data/levels/index.js".
  var FILES = [
    "src/bootstrap.js",
    "src/data/categories.js",
    "src/firebaseConfig.js",
    "src/utils/cloud.js",
    "src/data/levels/pre-intermediate.js",
    "src/data/levels/index.js",
    "src/utils/helpers.js",
    "src/utils/audio.js",
    "src/components/SpeakButton.jsx",
    "src/components/AccountSection.jsx",
    "src/components/HomeScreen.jsx",
    "src/components/MusicScreen.jsx",
    "src/components/PhraseScreen.jsx",
    "src/components/SummaryScreen.jsx",
    "src/components/QuizScreen.jsx",
    "src/components/LevelMenu.jsx",
    "src/app.jsx"
  ];

  function stripModuleSyntax(code) {
    // Os arquivos não usam import/export de verdade como mecanismo de
    // compartilhamento (isso é feito via escopo global, acima) — mas caso
    // algum arquivo tenha um import de "react" só por costume, removemos
    // aqui pra não quebrar o Babel.
    return code
      .replace(/^\s*import\s+(?:(?:React\s*,\s*)?\{([^}]+)\}|React|\*\s+as\s+React)\s+from\s*["']react["'];?\s*$/gm, function (_, namedImports) {
        return namedImports ? "const {" + namedImports + "} = React;" : "";
      })
      .replace(/export\s+default\s+/g, "");
  }

  async function loadAll() {
    var combined = "";
    for (var i = 0; i < FILES.length; i++) {
      var file = FILES[i];
      var res = await fetch(file + "?v=" + Date.now());
      if (!res.ok) {
        throw new Error("File " + file + " not found (status " + res.status + ").");
      }
      var code = await res.text();
      var cleaned = stripModuleSyntax(code);
      if (/^\s*(?:import|export)\b/m.test(cleaned)) {
        throw new Error("File " + file + " uses import/export, which isn't supported by the app's loader.");
      }
      var compiled = Babel.transform(cleaned, {
        filename: file,
        presets: [["react", { runtime: "classic" }]]
      }).code;

      combined += "\n// ---- " + file + " ----\n" + compiled + "\n";
    }

    // Um único eval(), com todos os arquivos já concatenados na ordem
    // certa — veja o comentário acima de FILES sobre por quê.
    (0, eval)(combined);
  }

  loadAll()
    .then(function () {
      if (typeof FlashcardCatalog === "undefined") {
        throw new Error("The FlashcardCatalog component wasn't found (check src/app.jsx).");
      }
      var root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(FlashcardCatalog));
    })
    .catch(function (err) {
      showError(err.message);
    });
</script>

</body>
</html>

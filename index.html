<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Outcomes Pre-Intermediate</title>
<style>
  html, body { margin: 0; padding: 0; background: #006437; }
  #error-box {
    display: none;
    color: #FFFFFF;
    font-family: sans-serif;
    padding: 24px;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.5;
  }
</style>

<!-- React (via CDN, sem precisar instalar nada) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel: converte o JSX do arquivo do app para JS puro, direto no navegador -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

<div id="root"></div>
<div id="error-box"></div>

<script>
  function showError(message) {
    var box = document.getElementById("error-box");
    box.style.display = "block";
    box.innerText = "Não consegui carregar o app.\n\n" + message +
      "\n\nConfira se o arquivo flashcards-ingles.jsx está no mesmo repositório, com esse nome exato.";
    console.error(message);
  }

  fetch("flashcards-ingles.jsx")
    .then(function (res) {
      if (!res.ok) throw new Error("Arquivo flashcards-ingles.jsx não encontrado (status " + res.status + ").");
      return res.text();
    })
    .then(function (code) {
      // O arquivo usa "import"/"export default", que é sintaxe de módulo ES.
      // Aqui removemos isso para rodar como um script comum no navegador,
      // usando os hooks do objeto global React (carregado via CDN acima).
      var cleaned = code
        .replace(/^\s*import\s*\{([^}]+)\}\s*from\s*["']react["'];?\s*$/m, "const {$1} = React;")
        .replace(/export\s+default\s+/, "");
      var compiled = Babel.transform(cleaned, { presets: ["react"] }).code;

      // Executa em escopo global, o que deixa FlashcardCatalog disponível a seguir
      (0, eval)(compiled);

      if (typeof FlashcardCatalog === "undefined") {
        throw new Error("O componente FlashcardCatalog não foi encontrado no arquivo.");
      }

      var root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(FlashcardCatalog));
    })
    .catch(function (err) {
      showError(err.message);
    });
</script>

</body>
</html>
